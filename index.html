<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <title>সাইটম্যান</title>
    <script>
      (function () {
        // Theme toggle is disabled — always boot in light. Restore the
        // preference/system branch when THEME_TOGGLE_ENABLED is turned back on.
        try {
          var theme = 'siteman'
          localStorage.setItem('siteman-theme', theme)
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', '#fafafa')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'siteman')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
