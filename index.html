<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FC6D4D" />
    <title>সাইট ম্যানেজার</title>
    <script>
      (function () {
        try {
          var key = 'siteman-theme'
          var preference = localStorage.getItem(key) || 'system'
          var dark =
            preference === 'siteman-dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute(
            'data-theme',
            dark ? 'siteman-dark' : 'siteman',
          )
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'siteman')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
