openapi: 3.0.3
info:
  title: SiteMan API
  version: 1.0.0 (v1)
  description: "Construction-site management API: auth, company, sites, labour, ledgers."
paths:
  /api/v1/activities:
    get:
      operationId: activities_list
      description: |-
        Company-scoped activity timeline (read + one-way review).

        Global gate: ``view_activitylog`` (list/retrieve), ``change_activitylog``
        (review). Rows are limited to daily_record and site_cash,
        then narrowed by allowed sites and each entity's
        ``view_<model>`` permission.
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum:
              - created
              - deleted
              - updated
          description: |-
            * `created` - Created
            * `updated` - Updated
            * `deleted` - Deleted
        - in: query
          name: actor
          schema:
            type: integer
        - in: query
          name: business_date
          schema:
            type: string
            format: date
        - in: query
          name: business_date__gte
          schema:
            type: string
            format: date
        - in: query
          name: business_date__lte
          schema:
            type: string
            format: date
        - in: query
          name: created_at__gte
          schema:
            type: string
            format: date-time
        - in: query
          name: created_at__lte
          schema:
            type: string
            format: date-time
        - in: query
          name: entity_id
          schema:
            type: integer
        - in: query
          name: entity_type
          schema:
            type: string
            enum:
              - billing_category
              - daily_record
              - labour
              - labour_session
              - private_site_cash
              - site
              - site_cash
              - user
          description: |-
            * `user` - User
            * `site` - Site
            * `billing_category` - Billing category
            * `site_cash` - Site cash
            * `private_site_cash` - Private site cash
            * `labour` - Labour
            * `daily_record` - Daily record
            * `labour_session` - Labour session
        - in: query
          name: labour
          schema:
            type: integer
        - name: page
          required: false
          in: query
          description: A page number within the paginated result set.
          schema:
            type: integer
        - name: page_size
          required: false
          in: query
          description: Number of results to return per page.
          schema:
            type: integer
        - in: query
          name: reviewed
          schema:
            type: boolean
        - in: query
          name: site
          schema:
            type: integer
      tags:
        - activities
      security:
        - jwtAuth: []
      responses:
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivitiesListErrorResponse400"
          description: ""
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
              examples:
                AuthenticationFailed:
                  value:
                    type: client_error
                    errors:
                      - code: authentication_failed
                        detail: Incorrect authentication credentials.
                        attr: null
                NotAuthenticated:
                  value:
                    type: client_error
                    errors:
                      - code: not_authenticated
                        detail: Authentication credentials were not provided.
                        attr: null
          description: ""
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
              examples:
                PermissionDenied:
                  value:
                    type: client_error
                    errors:
                      - code: permission_denied
                        detail: You do not have permission to perform this action.
                        attr: null
          description: ""
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse404"
              examples:
                NotFound:
                  value:
                    type: client_error
                    errors:
                      - code: not_found
                        detail: Not found.
                        attr: null
          description: ""
        "405":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse405"
              examples:
                MethodNotAllowed:
                  value:
                    type: client_error
                    errors:
                      - code: method_not_allowed
                        detail: Method "get" not allowed.
                        attr: null
          description: ""
        "406":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse406"
              examples:
                NotAcceptable:
                  value:
                    type: client_error
                    errors:
                      - code: not_acceptable
                        detail: Could not satisfy the request Accept header.
                        attr: null
          description: ""
        "415":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse415"
              examples:
                UnsupportedMediaType:
                  value:
                    type: client_error
                    errors:
                      - code: unsupported_media_type
                        detail: Unsupported media type "application/json" in request.
                        attr: null
          description: ""
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse429"
              examples:
                Throttled:
                  value:
                    type: client_error
                    errors:
                      - code: throttled
                        detail: Request was throttled.
                        attr: null
          description: ""
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse500"
              examples:
                APIException:
                  value:
                    type: server_error
                    errors:
                      - code: error
                        detail: A server error occurred.
                        attr: null
          description: ""
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedActivityLogList"
          description: ""
