          allOf:
            - $ref: "#/components/schemas/ActionEnum"
          readOnly: true
        entity_type:
          allOf:
            - $ref: "#/components/schemas/EntityTypeEnum"
          readOnly: true
        entity_id:
          type: integer
          readOnly: true
          description: PK of the business row at action time (may no longer exist).
        business_date:
          type: string
          format: date
          readOnly: true
          nullable: true
          description: Record's business date when applicable (e.g. attendance.date).
        changes:
          readOnly: true
          nullable: true
          description:
            "Create: key-field snapshot. Update: {field: {old, new}}. Delete:
            last snapshot."
        reviewed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reviewed_by:
          type: integer
          readOnly: true
          nullable: true
        reviewed_by_name:
          type: string
          readOnly: true
          nullable: true
        review_note:
          type: string
          readOnly: true
          nullable: true
          description: Optional note when an auditor marks this log reviewed.
        created_at:
          type: string
          format: date-time
          readOnly: true
          description: When the action was performed (audit clock).
